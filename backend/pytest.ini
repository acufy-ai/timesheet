[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
testpaths = tests
python_files = test_*.py
# Make `from app...` imports resolve when pytest is invoked from this
# directory (the standard CI path) instead of from /app inside a
# container. Without this, GitHub Actions hits ModuleNotFoundError on
# the very first import in tests/conftest.py.
pythonpath = .
