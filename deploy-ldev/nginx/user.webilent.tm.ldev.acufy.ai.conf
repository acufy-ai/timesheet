# /etc/nginx/conf.d/user.webilent.tm.ldev.acufy.ai.conf
#
# Acufy Timesheet (ldev)
#   backend         -> 127.0.0.1:18030  (FastAPI in Docker)
#   frontend (new)  -> 127.0.0.1:13050  (frontend2, served at /)
#   frontend (old)  -> 127.0.0.1:13051  (frontend, served at /legacy/)
#
# /legacy/ routes to the classic frontend container, which was built with
# VITE_BASE_PATH=/legacy/ so the SPA router and asset URLs both nest under
# that prefix. Both UIs share an origin so sessionStorage tokens persist
# when the in-app FrontendSwitcher hops between them.
#
# Routing trick: many backend API prefixes collide with SPA client routes
# (e.g. /dashboard, /approvals, /time-off, /platform/settings). The browser
# navigates to those as HTML requests; the frontend's axios client calls
# them with JSON. We distinguish on the request's Accept/Content-Type
# headers:
#   - JSON-ish requests  -> backend
#   - everything else    -> frontend SPA
#
# Reload after changing this file:
#   sudo nginx -t && sudo systemctl reload nginx

# Routing for prefixes shared between SPA and API (e.g. /dashboard is
# both a frontend route and a backend API prefix).
#
# Rule: route to the BACKEND unless the request is clearly a top-level
# browser navigation, in which case serve the SPA shell.
#
# Top-level browser navigations send Sec-Fetch-Dest: document. Anything
# else (XHR, fetch, blob, iframe) sends a different value. Crucially the
# blob iframe for PDF preview asks for the attachment URL with
# Accept: */*, which my old "Accept: application/json" check
# misclassified as a navigation -> served HTML instead of the file.
#
# The map below evaluates Sec-Fetch-Dest first; if absent (older clients,
# server-side scripts), it falls back to the Accept header looking for
# the html-only signature of a navigation.
map "$http_sec_fetch_dest:$http_accept" $is_api_call {
    default                                                              1;
    "~^document:"                                                        0;  # browser navigation, any Accept
    "~^iframe:"                                                          0;  # nested document
    "~^:.*text/html.*application/xhtml\+xml"                             0;  # no Sec-Fetch-Dest, looks like nav
}

server {
    listen 80;
    server_name user.webilent.tm.ldev.acufy.ai;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name user.webilent.tm.ldev.acufy.ai;

    ssl_certificate     /etc/letsencrypt/live/user.webilent.tm.ldev.acufy.ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/user.webilent.tm.ldev.acufy.ai/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Email attachments / CSV imports can be large.
    client_max_body_size 32m;

    # Shared proxy settings.
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;

    # ── Backend: explicit /api alias (always routed to backend, no
    # ambiguity since /api is not an SPA prefix) ─────────────────────
    location /api/ {
        proxy_pass http://127.0.0.1:18030/;
    }

    # Health probe convenience (no SPA route at /health).
    location = /health {
        proxy_pass http://127.0.0.1:18030/health;
    }

    # ── Legacy (classic) frontend, served at /legacy/. Built with
    # VITE_BASE_PATH=/legacy/ so the React router treats this as the
    # app root and asset URLs (/legacy/assets/*, /legacy/logos/*) are
    # all served by that container. Trailing slash on both sides
    # preserves the rest of the URL after /legacy/. ──────────────────
    location /legacy/ {
        proxy_pass http://127.0.0.1:13051/legacy/;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
    }
    # Bare /legacy with no trailing slash: redirect to /legacy/ so the
    # SPA shell and asset paths resolve correctly.
    location = /legacy {
        return 301 /legacy/;
    }

    # ── Backend: top-level API prefixes from backend/app/api/*.
    # Each location uses content negotiation: routes JSON-ish requests
    # to the backend, falls through to the SPA otherwise. Without this,
    # navigating to /dashboard or /approvals in the browser would land
    # on the backend JSON response instead of the React app.
    location /auth {
        if ($is_api_call) { proxy_pass http://127.0.0.1:18030; break; }
        proxy_pass http://127.0.0.1:13050;
    }
    location /users {
        if ($is_api_call) { proxy_pass http://127.0.0.1:18030; break; }
        proxy_pass http://127.0.0.1:13050;
    }
    location /clients {
        if ($is_api_call) { proxy_pass http://127.0.0.1:18030; break; }
        proxy_pass http://127.0.0.1:13050;
    }
    location /departments {
        if ($is_api_call) { proxy_pass http://127.0.0.1:18030; break; }
        proxy_pass http://127.0.0.1:13050;
    }
    location /leave-types {
        if ($is_api_call) { proxy_pass http://127.0.0.1:18030; break; }
        proxy_pass http://127.0.0.1:13050;
    }
    location /projects {
        if ($is_api_call) { proxy_pass http://127.0.0.1:18030; break; }
        proxy_pass http://127.0.0.1:13050;
    }
    location /tasks {
        if ($is_api_call) { proxy_pass http://127.0.0.1:18030; break; }
        proxy_pass http://127.0.0.1:13050;
    }
    location /timesheets {
        if ($is_api_call) { proxy_pass http://127.0.0.1:18030; break; }
        proxy_pass http://127.0.0.1:13050;
    }
    location /approvals {
        if ($is_api_call) { proxy_pass http://127.0.0.1:18030; break; }
        proxy_pass http://127.0.0.1:13050;
    }
    location /time-off {
        if ($is_api_call) { proxy_pass http://127.0.0.1:18030; break; }
        proxy_pass http://127.0.0.1:13050;
    }
    location /time-off-approvals {
        if ($is_api_call) { proxy_pass http://127.0.0.1:18030; break; }
        proxy_pass http://127.0.0.1:13050;
    }
    location /dashboard {
        if ($is_api_call) { proxy_pass http://127.0.0.1:18030; break; }
        proxy_pass http://127.0.0.1:13050;
    }
    location /notifications {
        if ($is_api_call) { proxy_pass http://127.0.0.1:18030; break; }
        proxy_pass http://127.0.0.1:13050;
    }
    location /tenants {
        if ($is_api_call) { proxy_pass http://127.0.0.1:18030; break; }
        proxy_pass http://127.0.0.1:13050;
    }
    location /platform {
        if ($is_api_call) { proxy_pass http://127.0.0.1:18030; break; }
        proxy_pass http://127.0.0.1:13050;
    }
    location /sync {
        if ($is_api_call) { proxy_pass http://127.0.0.1:18030; break; }
        proxy_pass http://127.0.0.1:13050;
    }
    location /mailboxes {
        if ($is_api_call) { proxy_pass http://127.0.0.1:18030; break; }
        proxy_pass http://127.0.0.1:13050;
    }
    location /ingestion {
        if ($is_api_call) { proxy_pass http://127.0.0.1:18030; break; }
        proxy_pass http://127.0.0.1:13050;
    }
    location /admin {
        if ($is_api_call) { proxy_pass http://127.0.0.1:18030; break; }
        proxy_pass http://127.0.0.1:13050;
    }
    location /attention-signals {
        if ($is_api_call) { proxy_pass http://127.0.0.1:18030; break; }
        proxy_pass http://127.0.0.1:13050;
    }

    # Frontend catch-all (SPA shell, static assets, any client-side route
    # not handled above).
    location / {
        proxy_pass http://127.0.0.1:13050;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
    }
}
