version: "3.9"

services:
  # ── PostgreSQL ─────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: timesheet_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in the environment or .env file}
      POSTGRES_DB: timesheet_db
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Init scripts run only on a fresh data volume. The 01-script
      # creates the control-plane database alongside timesheet_db.
      # Existing volumes need a one-time `createdb acufy_control`.
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U timesheet_user -d timesheet_db"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── Redis ──────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── Backend API ────────────────────────────────────────────
  api:
    build: ./backend
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      # When DATABASE_URL / CONTROL_DATABASE_URL are set in backend/.env
      # (e.g. pointing at the Lightsail Postgres), they win. Otherwise we
      # fall back to the local ``db`` container that this compose file
      # also runs.
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://timesheet_user:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in the environment or .env file}@db:5432/timesheet_db}
      CONTROL_DATABASE_URL: ${CONTROL_DATABASE_URL:-postgresql+asyncpg://timesheet_user:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in the environment or .env file}@db:5432/acufy_control}
      REDIS_URL: redis://redis:6379
      TZ: ${TZ:-America/Chicago}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Startup chain:
    #   1. alembic upgrade head -- migrates the shared/legacy timesheet_db
    #   2. migrate_all_tenants.py -- migrates every isolated per-tenant DB
    #      to head. Required because per-tenant DBs have their OWN
    #      alembic_version row and DO NOT get migrated by the shared
    #      upgrade in step 1. Skipping this is what caused the
    #      consecutive_fetch_failures-column-missing outage on 2026-05-28.
    #   3. uvicorn -- start the api.
    # If the fleet migrator fails for one tenant, the script exits non-zero
    # and uvicorn doesn't start; the container restarts and the deploy
    # surfaces the failure rather than serving a half-migrated cluster.
    command: >
      sh -c "
        alembic upgrade head &&
        PYTHONPATH=/app python scripts/migrate_all_tenants.py &&
        uvicorn app.main:app --host 0.0.0.0 --port 8000
      "
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health', timeout=2).status == 200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  # ── Background Worker ─────────────────────────────────────
  worker:
    build: ./backend
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://timesheet_user:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in the environment or .env file}@db:5432/timesheet_db}
      CONTROL_DATABASE_URL: ${CONTROL_DATABASE_URL:-postgresql+asyncpg://timesheet_user:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in the environment or .env file}@db:5432/acufy_control}
      REDIS_URL: redis://redis:6379
      TZ: ${TZ:-America/Chicago}
    volumes:
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: python run_worker.py
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f run_worker.py > /dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # ── Frontend (new UI, frontend3) ──────────────────────────
  # frontend3 is the cutover UI. VITE_BASE_PATH lets it serve under a sub-path
  # (prod: /apps/timesheet/) and VITE_API_BASE_URL points it at the API's
  # absolute origin (prod fronts both the SPA sub-path and /api via host nginx).
  # Both default to root / same-origin for local/dev.
  # Rollback: set context back to ./frontend2 (+ restore its args) and rebuild.
  frontend:
    build:
      context: ./frontend3
      args:
        VITE_BASE_PATH: ${VITE_BASE_PATH:-/}
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-5174}:80"
    depends_on:
      - api

volumes:
  pgdata:
  uploads:
