server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers on every response. HSTS is set with `always` so
    # nginx emits it even on 4xx/5xx responses (deliberate: once a domain
    # opts into HSTS, you don't want a brief error response to give a
    # MITM the chance to downgrade the next session).
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # CSP for the static SPA. `connect-src` is templated at container
    # startup so dev (different origin from the API) and prod (same
    # origin) can both work without rebuilding the image. `unsafe-inline`
    # for script + style is needed for the theme-bootstrap snippet in
    # index.html and for Tailwind/component-style runtime injection.
    # `frame-ancestors 'none'` and `base-uri 'self'` mirror the backend
    # so iframes and base-href tricks are blocked.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob:; connect-src 'self' __CSP_CONNECT_SRC__; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    location __BASE_PATH__/assets/ {
        alias /usr/share/nginx/html/assets/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Static public/ files (logos, favicons, etc.) — alias so sub-path deploys
    # don't fall through to index.html and serve HTML as a PNG.
    location __BASE_PATH__/logos/ {
        alias /usr/share/nginx/html/logos/;
        expires 7d;
        add_header Cache-Control "public";
    }

    location __BASE_PATH_ROOT__ {
        try_files $uri /index.html;
    }

    location = __BASE_PATH__/index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires 0;
    }

    location = /health {
        access_log off;
        return 200 'ok';
    }
}
