<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#07041a" />
    <!-- Self-hosted brand fonts. Served from /public/fonts/ so corporate
         proxies and offline dev sessions don't drop us back to system
         sans. Files are pre-subset latin WOFF2s pulled from Google Fonts
         (see audit/design/fonts/ for the source set). ~170 KB total. -->
    <style>
      @font-face { font-family: 'Space Grotesk'; font-style: normal; font-weight: 400; src: url('/fonts/space-grotesk-400.woff2') format('woff2'); font-display: swap; }
      @font-face { font-family: 'Space Grotesk'; font-style: normal; font-weight: 500; src: url('/fonts/space-grotesk-500.woff2') format('woff2'); font-display: swap; }
      @font-face { font-family: 'Space Grotesk'; font-style: normal; font-weight: 600; src: url('/fonts/space-grotesk-600.woff2') format('woff2'); font-display: swap; }
      @font-face { font-family: 'Space Grotesk'; font-style: normal; font-weight: 700; src: url('/fonts/space-grotesk-700.woff2') format('woff2'); font-display: swap; }
      @font-face { font-family: 'Syne';          font-style: normal; font-weight: 700; src: url('/fonts/syne-700.woff2')         format('woff2'); font-display: swap; }
      @font-face { font-family: 'Syne';          font-style: normal; font-weight: 800; src: url('/fonts/syne-800.woff2')         format('woff2'); font-display: swap; }
      @font-face { font-family: 'JetBrains Mono'; font-style: normal; font-weight: 400; src: url('/fonts/jetbrains-mono-400.woff2') format('woff2'); font-display: swap; }
      @font-face { font-family: 'JetBrains Mono'; font-style: normal; font-weight: 500; src: url('/fonts/jetbrains-mono-500.woff2') format('woff2'); font-display: swap; }
      @font-face { font-family: 'Instrument Serif'; font-style: italic; font-weight: 400; src: url('/fonts/instrument-serif-italic.woff2') format('woff2'); font-display: swap; }
    </style>
    <title>Acufy AI Timesheet</title>
    <script>
      // Prevent flash of wrong theme. Maps the frontend2 variant key to the
      // matching dark/light shadcn class + data-theme attribute so the first
      // paint already has the right palette.
      (function () {
        var DEFAULTS = { dark: 'violet-night', light: 'cyan-light' };
        var VALID = [
          'violet-night', 'emerald-night', 'amber-night',
          'cyan-light', 'rose-light', 'sapphire-light',
        ];
        var DARK = { 'violet-night': 1, 'emerald-night': 1, 'amber-night': 1 };
        var stored = localStorage.getItem('acufy-theme-variant-v2');
        var key = stored && VALID.indexOf(stored) >= 0
          ? stored
          : (window.matchMedia('(prefers-color-scheme: dark)').matches ? DEFAULTS.dark : DEFAULTS.light);
        var mode = DARK[key] ? 'dark' : 'light';
        var root = document.documentElement;
        root.classList.remove('light', 'dark');
        root.classList.add(mode);
        root.setAttribute('data-theme', key);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
