server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers (mirrors frontend2). HSTS with `always` so it is emitted
    # even on error responses.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # CSP for the SPA. Same-origin connect-src ('self') is enough because the
    # API is reverse-proxied under /api on this same host (see the /api/ block).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # API reverse-proxy. frontend3's axios client uses a RELATIVE baseURL of
    # '/api', so the SPA and the API are same-origin (no CORS). The trailing
    # slash on proxy_pass strips the /api prefix: /api/auth/me -> /auth/me.
    location /api/ {
        proxy_pass http://api:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Upgrade headers in case any endpoint streams / uses websockets later.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        # Ingestion fetch + large uploads can take a while; relax timeouts.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        client_max_body_size 50m;
    }

    # Long-cache hashed build assets.
    location /assets/ {
        alias /usr/share/nginx/html/assets/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Static public/ files (logos, favicons) — alias so they don't fall through
    # to the SPA index and serve HTML as an image.
    location /logos/ {
        alias /usr/share/nginx/html/logos/;
        expires 7d;
        add_header Cache-Control "public";
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires 0;
    }

    location = /health {
        access_log off;
        return 200 'ok';
    }

    # SPA fallback for client-side routing.
    location / {
        try_files $uri /index.html;
    }
}
