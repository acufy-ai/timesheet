server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers (mirrors frontend2). HSTS with `always` so it is emitted
    # even on error responses.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # CSP for the SPA. The API is reached at its own absolute origin (the host
    # reverse-proxy serves both the SPA sub-path and /api), so connect-src must
    # allow the same origin the page is on. 'self' covers same-origin XHR.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # Hashed build assets, served under the deploy sub-path. The base-path build
    # emits asset URLs like __BASE_PATH__/assets/...; alias them to the on-disk
    # assets dir (which lives at the html root regardless of sub-path).
    location __BASE_PATH__/assets/ {
        alias /usr/share/nginx/html/assets/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Static public/ files (logos, favicons, fonts) under the sub-path.
    location __BASE_PATH__/logos/ {
        alias /usr/share/nginx/html/logos/;
        expires 7d;
        add_header Cache-Control "public";
    }
    location __BASE_PATH__/fonts/ {
        alias /usr/share/nginx/html/fonts/;
        expires 30d;
        add_header Cache-Control "public";
    }

    location = __BASE_PATH__/index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires 0;
    }

    # Root-level static files that live directly in the html root (the logo SVG,
    # favicon, service worker, manifest, etc.). Without this they fall through to
    # the SPA index and a fetch for /<sub-path>/acufy-logo.svg gets HTML back —
    # which is why the header logo went missing. The regex strips the sub-path
    # prefix and serves the file from the html root.
    location ~ ^__BASE_PATH__/([^/]+\.(svg|png|ico|webmanifest|json|js|txt|woff2?))$ {
        root /usr/share/nginx/html;
        try_files /$1 =404;
        expires 7d;
        add_header Cache-Control "public";
    }

    location = /health {
        access_log off;
        return 200 'ok';
    }

    # SPA fallback: any path under the sub-path that isn't a real file serves
    # index.html so client-side routing (react-router basename) takes over.
    location __BASE_PATH_ROOT__ {
        try_files $uri /index.html;
    }
}
